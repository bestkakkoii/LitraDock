name: Native candidate
on:
  workflow_dispatch:
  push:
    branches: [native-demo-003, native-demo-004, native-demo-005, native-demo-006, native-demo-007, native-demo-008, native-demo-009, native-demo-010, native-demo-011, native-demo-012, native-demo-015, native-demo-016, native-demo-018, native-demo-021, native-demo-022]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: native_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: litradock_native_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U native_test -d litradock_native_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/literature-server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/literature-web/package-lock.json
      - name: Isolated synthetic configuration
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          config=json.loads(pathlib.Path('src/literature-server/config.example.json').read_text())
          config['Database']='host=127.0.0.1 user=native_test password=synthetic-ci-only dbname=litradock_native_test_ci sslmode=disable'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-test.json'
          target.write_text(json.dumps(config));target.chmod(0o600)
          PY
      - name: Native engine and offline contracts
        working-directory: src/literature-server
        env:
          LITRADOCK_NATIVE_TEST: 'yes'
          LITRADOCK_GO_CONFIG: ${{ runner.temp }}/native-test.json
          NATIVE_SNAPSHOT_TEST_OUTPUT: ${{ runner.temp }}/native-snapshot
          NATIVE_BUNDLE_TEST_OUTPUT: ${{ runner.temp }}/native-bundle
          NATIVE_WORKBOOK_TEST_OUTPUT: ${{ runner.temp }}/native-workbook
          NATIVE_MULTIRUN_TEST_OUTPUT: ${{ runner.temp }}/native-multirun
          NATIVE_PLAN_EXPORT_TEST_OUTPUT: ${{ runner.temp }}/native-plan-export
          NATIVE_STRUCTURED_TEST_OUTPUT: ${{ runner.temp }}/native-structured
          LITRADOCK_SELECTION_ARTIFACT_DIR: ${{ runner.temp }}/native-selection
        run: |
          go test -count=1 -v ./...
          go vet ./...
      - name: Independent structured UTF-8 reader and mutation controls
        run: |
          python3 tests/native-browser/verify-structured.py "$RUNNER_TEMP/native-structured/synthetic.json" "$RUNNER_TEMP/native-structured/synthetic.jsonl" --synthetic --negative-controls --require-source-outcomes
          python3 tests/native-browser/verify-structured.py "$RUNNER_TEMP/native-structured/postgres-synthetic.json" "$RUNNER_TEMP/native-structured/postgres-synthetic.jsonl" --negative-controls --require-source-outcomes
      - name: Independent partitioned originals reader
        run: python3 tests/native-browser/verify-bundle.py "$RUNNER_TEMP/native-bundle/bundle.json" "$RUNNER_TEMP"/native-bundle/*.zip --synthetic --negative-controls --require-source-outcomes
      - name: Independent whole-plan ZIP and typed metadata controls
        run: python3 tests/native-browser/verify-plan-export.py "$RUNNER_TEMP/native-plan-export/plan-synthetic.json" "$RUNNER_TEMP/native-plan-export/plan-synthetic.zip" --synthetic --negative-controls --require-source-outcomes
      - name: Independent frozen multi-run saved-set reader
        run: python3 tests/native-browser/verify-plan-export.py "$RUNNER_TEMP/native-multirun/saved-set.json" "$RUNNER_TEMP/native-multirun/saved-set.zip" --expected-saved-set "$RUNNER_TEMP/native-multirun/intent.json" --negative-controls --synthetic-transport --require-source-outcomes
      - name: Independent workbook reader and mutation controls
        run: |
          python3 -m venv "$RUNNER_TEMP/workbook-reader"
          "$RUNNER_TEMP/workbook-reader/bin/pip" install --require-hashes -r tests/native-browser/workbook-requirements.txt
          "$RUNNER_TEMP/workbook-reader/bin/python" tests/native-browser/verify-workbook.py "$RUNNER_TEMP/native-workbook/synthetic.xlsx" --synthetic --negative-controls
          echo "NATIVE_WORKBOOK_PYTHON=$RUNNER_TEMP/workbook-reader/bin/python" >> "$GITHUB_ENV"
      - name: Independent saved snapshot readers
        run: |
          "$RUNNER_TEMP/workbook-reader/bin/python" tests/native-browser/verify-saved-snapshot.py "$RUNNER_TEMP/native-snapshot"
      - name: Independent exact selected metadata readers and mutation controls
        run: '"$RUNNER_TEMP/workbook-reader/bin/python" tests/native-browser/verify-run-selection.py "$RUNNER_TEMP/native-selection"'
      - name: Repeated compiler outputs
        run: |
          mkdir -p "$RUNNER_TEMP/native-build"
          cd src/literature-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/native-build/server" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/native-build/server-repeat" .
          cd ../literature-web
          npm ci
          npm test
          npm run build
          cp -r dist "$RUNNER_TEMP/web-one"
          npm run build
          cp -r dist "$RUNNER_TEMP/web-two"
      - name: Source and runtime negative controls
        run: |
          python3 scripts/create-native-source.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/native-build/source.tar"
          python3 scripts/package-go-runtime.py --revision "$GITHUB_SHA" --build-directory "$RUNNER_TEMP/native-build" --frontend-directory "$RUNNER_TEMP/web-one" --frontend-repeat-directory "$RUNNER_TEMP/web-two"
      - name: Pinned isolated browser dependencies
        working-directory: tests/native-browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compiled PDF selection and download transport controls
        working-directory: src/literature-web
        run: node scripts/pdf-browser-check.mjs
      - name: Compiled durable selection interruption and scope controls
        working-directory: src/literature-web
        run: node scripts/durable-selection-browser-check.mjs
      - name: Compact visual workspace and navigation boundaries
        working-directory: src/literature-web
        run: node scripts/compact-browser-check.mjs
      - name: Compiled source outcomes and export scope
        working-directory: src/literature-web
        run: node scripts/source-outcome-browser-check.mjs
      - name: Compiled structured download transport controls
        working-directory: src/literature-web
        run: node scripts/structured-browser-check.mjs
      - name: Compiled whole-plan export transport controls
        working-directory: src/literature-web
        run: node scripts/plan-export-browser-check.mjs
      - name: Compiled multi-run basket and paced transfer controls
        working-directory: src/literature-web
        run: node scripts/multirun-browser-check.mjs
      - name: Compiled continuation and saved-selection transport controls
        working-directory: src/literature-web
        run: node scripts/continuation-browser-check.mjs
      - name: Compiled partitioned transfer and stale-body controls
        working-directory: src/literature-web
        run: node scripts/bundle-browser-check.mjs
      - name: Fresh native PostgreSQL browser database
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h 127.0.0.1 -U native_test litradock_native_test_browser_ci
          python3 - <<'PY'
          import json,os,pathlib
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-browser-config.json'
          target.write_text(json.dumps({'Database':'host=127.0.0.1 user=native_test password=synthetic-ci-only dbname=litradock_native_test_browser_ci sslmode=disable'}))
          target.chmod(0o600)
          PY
      - name: Actual native PostgreSQL and compiled browser regression
        run: |
          python3 scripts/run-native-browser.py --revision "$GITHUB_SHA" --config "$RUNNER_TEMP/native-browser-config.json" --manifest "$RUNNER_TEMP/native-build/runtime-manifest.json" --frontend-directory "$RUNNER_TEMP/web-one" --output-directory "$RUNNER_TEMP/native-browser"
      - name: Fresh processing-plan browser database
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h 127.0.0.1 -U native_test litradock_native_test_browser_plans
          python3 - <<'PY'
          import json,os,pathlib
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-plan-browser-config.json'
          target.write_text(json.dumps({'Database':'host=127.0.0.1 user=native_test password=synthetic-ci-only dbname=litradock_native_test_browser_plans sslmode=disable'}))
          target.chmod(0o600)
          PY
          python3 scripts/run-native-browser.py --plans --revision "$GITHUB_SHA" --config "$RUNNER_TEMP/native-plan-browser-config.json" --manifest "$RUNNER_TEMP/native-build/runtime-manifest.json" --frontend-directory "$RUNNER_TEMP/web-one" --output-directory "$RUNNER_TEMP/native-plan-browser"
      - name: Fresh multi-run PostgreSQL and compiled browser
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h 127.0.0.1 -U native_test litradock_native_test_browser_multirun
          python3 - <<'PY'
          import json,os,pathlib
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-multirun-browser-config.json'
          target.write_text(json.dumps({'Database':'host=127.0.0.1 user=native_test password=synthetic-ci-only dbname=litradock_native_test_browser_multirun sslmode=disable'}))
          target.chmod(0o600)
          PY
          python3 scripts/run-native-browser.py --multirun --revision "$GITHUB_SHA" --config "$RUNNER_TEMP/native-multirun-browser-config.json" --manifest "$RUNNER_TEMP/native-build/runtime-manifest.json" --frontend-directory "$RUNNER_TEMP/web-one" --output-directory "$RUNNER_TEMP/native-multirun-browser"
      - name: Fresh continuation PostgreSQL and compiled browser
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h 127.0.0.1 -U native_test litradock_native_test_browser_continuation
          python3 - <<'PY'
          import json,os,pathlib
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-continuation-browser-config.json'
          target.write_text(json.dumps({'Database':'host=127.0.0.1 user=native_test password=synthetic-ci-only dbname=litradock_native_test_browser_continuation sslmode=disable'}))
          target.chmod(0o600)
          PY
          python3 scripts/run-native-browser.py --continuation --revision "$GITHUB_SHA" --config "$RUNNER_TEMP/native-continuation-browser-config.json" --manifest "$RUNNER_TEMP/native-build/runtime-manifest.json" --frontend-directory "$RUNNER_TEMP/web-one" --output-directory "$RUNNER_TEMP/native-continuation-browser"
      - name: Fresh bundle PostgreSQL and compiled browser
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h 127.0.0.1 -U native_test litradock_native_test_browser_bundles
          python3 - <<'PY'
          import json,os,pathlib
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-bundle-browser-config.json'
          target.write_text(json.dumps({'Database':'host=127.0.0.1 user=native_test password=synthetic-ci-only dbname=litradock_native_test_browser_bundles sslmode=disable'}))
          target.chmod(0o600)
          PY
          python3 scripts/run-native-browser.py --bundles --revision "$GITHUB_SHA" --config "$RUNNER_TEMP/native-bundle-browser-config.json" --manifest "$RUNNER_TEMP/native-build/runtime-manifest.json" --frontend-directory "$RUNNER_TEMP/web-one" --output-directory "$RUNNER_TEMP/native-bundle-browser"
      - name: Fresh browser-origin PubMed PostgreSQL and compiled browser
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h 127.0.0.1 -U native_test litradock_native_test_browser_user_route
          python3 - <<'PY'
          import json,os,pathlib
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-user-route-browser-config.json'
          target.write_text(json.dumps({'Database':'host=127.0.0.1 user=native_test password=synthetic-ci-only dbname=litradock_native_test_browser_user_route sslmode=disable'}))
          target.chmod(0o600)
          PY
          python3 scripts/run-native-browser.py --user-route --revision "$GITHUB_SHA" --config "$RUNNER_TEMP/native-user-route-browser-config.json" --manifest "$RUNNER_TEMP/native-build/runtime-manifest.json" --frontend-directory "$RUNNER_TEMP/web-one" --output-directory "$RUNNER_TEMP/native-user-route-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-synthetic-evidence
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/native-user-route-browser/receipt.json
            ${{ runner.temp }}/native-user-route-browser/browser.log
            ${{ runner.temp }}/native-user-route-browser/server.log
            ${{ runner.temp }}/native-user-route-browser/user-route-*.png
            ${{ runner.temp }}/native-user-route-browser/user-route-evidence.json
            ${{ runner.temp }}/native-selection/SYNTHETIC-selected.*
            src/literature-web/.litradock/runtime/native023a/**/result.json
            src/literature-web/.litradock/runtime/native023a/**/*.png
            src/literature-web/.litradock/runtime/native022/**/result.json
            src/literature-web/.litradock/runtime/native022/**/*.png
            src/literature-web/.litradock/runtime/frontend018/**/result.json
            ${{ runner.temp }}/native-bundle-browser/receipt.json
            ${{ runner.temp }}/native-bundle-browser/browser.log
            ${{ runner.temp }}/native-bundle-browser/server.log
            ${{ runner.temp }}/native-bundle-browser/bundle-reader.json
            ${{ runner.temp }}/native-bundle-browser/bundle.download.json
            ${{ runner.temp }}/native-bundle-browser/*.zip
            ${{ runner.temp }}/native-bundle-browser/*.png
            ${{ runner.temp }}/native-bundle/*.json
            src/literature-web/.litradock/runtime/frontend012/**/result.json
            src/literature-web/.litradock/runtime/frontend015/**/result.json
            src/literature-web/.litradock/runtime/frontend016/**/result.json
            src/literature-web/.litradock/runtime/frontend017/**/result.json
            ${{ runner.temp }}/native-continuation-browser/receipt.json
            ${{ runner.temp }}/native-continuation-browser/browser.log
            ${{ runner.temp }}/native-continuation-browser/server.log
            ${{ runner.temp }}/native-continuation-browser/initial-page.json
            ${{ runner.temp }}/native-continuation-browser/continued-page.json
            ${{ runner.temp }}/native-continuation-browser/continued-run.csv
            ${{ runner.temp }}/native-continuation-browser/input.json.source-requests
            ${{ runner.temp }}/native-browser/receipt.json
            ${{ runner.temp }}/native-browser/compile.log
            ${{ runner.temp }}/native-browser/server.log
            ${{ runner.temp }}/native-browser/browser.log
            ${{ runner.temp }}/native-plan-browser/receipt.json
            ${{ runner.temp }}/native-plan-browser/server.log
            ${{ runner.temp }}/native-plan-browser/browser.log
            ${{ runner.temp }}/native-multirun/*.json
            ${{ runner.temp }}/native-multirun/*.zip
            ${{ runner.temp }}/native-multirun-browser/receipt.json
            ${{ runner.temp }}/native-multirun-browser/browser.log
            ${{ runner.temp }}/native-multirun-browser/server.log
            ${{ runner.temp }}/native-multirun-browser/*.download.*
            ${{ runner.temp }}/native-multirun-browser/*.intent.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-code-runtime
          path: |
            ${{ runner.temp }}/native-build/runtime.tar
            ${{ runner.temp }}/native-build/runtime-manifest.json
            ${{ runner.temp }}/native-build/runtime-package.json
            ${{ runner.temp }}/native-build/source.tar

name: Hosted foundation verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: litradock_ci_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LITRADOCK_PG_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=litradock_ci_foundation;Username=fixture;Password=synthetic-ci-only-password;SSL Mode=Disable
      LITRADOCK_ALLOW_EPHEMERAL_TEST: 'yes'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.400'
      - name: Environment and locked restore
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet --info > evidence/environment.txt
          uname -a >> evidence/environment.txt
          lscpu >> evidence/environment.txt
          free -m >> evidence/environment.txt
          dotnet restore tests/LitraDock.HostedVerification --locked-mode 2>&1 | tee evidence/restore.log
      - name: Build and offline checks
        run: |
          set -euo pipefail
          dotnet build tests/LitraDock.HostedVerification -c Release --no-restore 2>&1 | tee evidence/build.log
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --static .litradock/static 2>&1 | tee evidence/static.log
          cp .litradock/static/result.json evidence/static-result.json
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --sources .litradock/sources 2>&1 | tee evidence/sources.log
          cp .litradock/sources/result.json evidence/sources-result.json
      - name: Pinned offline document assets and actual PDF rendering
        run: |
          set -euo pipefail
          export DOCUMENT_WORKER="$PWD/src/document-worker/worker.mjs"
          echo "DOCUMENT_WORKER=$DOCUMENT_WORKER" >> "$GITHUB_ENV"
          npm ci --prefix src/document-worker --ignore-scripts 2>&1 | tee evidence/document-npm.log
          python3 src/document-worker/setup-assets.py 2>&1 | tee evidence/document-assets.log
          node src/document-worker/node_modules/playwright/cli.js install --with-deps chromium 2>&1 | tee evidence/document-browser-install.log
          python3 -m venv .litradock/pdf-verification
          .litradock/pdf-verification/bin/python -m pip install --only-binary=:all: --require-hashes -r tests/documents/requirements.txt 2>&1 | tee evidence/pdf-dependencies.log
          # Install only the helper shipped with this pinned Chromium download; preserve AppArmor policy.
          browser_path=$(node --input-type=module -e "import {chromium} from './src/document-worker/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")
          helper_path="$(dirname "$browser_path")/chrome_sandbox"
          test -f "$helper_path"
          sha256sum "$helper_path" | tee evidence/chromium-sandbox-helper.txt
          sudo install -d -o root -g root -m 0755 /opt/document-worker-sandbox
          sudo install -o root -g root -m 4755 "$helper_path" /opt/document-worker-sandbox/chrome-sandbox
          export CHROME_DEVEL_SANDBOX=/opt/document-worker-sandbox/chrome-sandbox
          stat -c '%U %a %n' "$CHROME_DEVEL_SANDBOX" >> evidence/chromium-sandbox-helper.txt
          echo "CHROME_DEVEL_SANDBOX=$CHROME_DEVEL_SANDBOX" >> "$GITHUB_ENV"
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --research-metadata .litradock/metadata 2>&1 | tee evidence/research-metadata.log
          .litradock/pdf-verification/bin/python tests/documents/interchange.py .litradock/metadata 2>&1 | tee evidence/interchange.log
          cp .litradock/metadata/interchange* evidence/
          cp .litradock/metadata/result.json evidence/metadata-result.json
          node tests/documents/preflight.mjs 2>&1 | tee evidence/document-preflight.log
          python3 tests/recovery/measure.py evidence/document-resources.json -- node tests/documents/verify.mjs .litradock/documents 2>&1 | tee evidence/document-tests.log
          .litradock/pdf-verification/bin/python tests/documents/pdf_checks.py .litradock/documents 2>&1 | tee evidence/pdf-inspection.log
          cp .litradock/documents/*-result.json .litradock/documents/pdf-inspection.json .litradock/documents/*-page-*.png evidence/
          cp .litradock/documents/result.json evidence/document-result.json
      - name: Actual PostgreSQL, migration, lease and HTTP isolation checks
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --postgres .litradock/postgres 2>&1 | tee evidence/postgres.log
          cp .litradock/postgres/result.json evidence/postgres-result.json
          cp .litradock/postgres/source-scale.json evidence/source-scale.json
      - name: Actual account lifecycle, rollback and lock concurrency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --identity .litradock/identity 2>&1 | tee evidence/identity.log
          cp .litradock/identity/result.json evidence/identity-result.json
          cp .litradock/identity/environment.json evidence/identity-environment.json
          cp .litradock/identity/operator-results.json evidence/identity-operator-results.json
      - name: Actual research decisions, conversions and selected relocation
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tests/recovery/measure.py evidence/research-resources.json -- dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --research .litradock/research 2>&1 | tee evidence/research.log
          cp .litradock/research/result.json evidence/research-result.json
          cp .litradock/research/research-scale.json evidence/
      - name: Actual demo admission and quota concurrency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --demo .litradock/demo 2>&1 | tee evidence/demo.log
          cp .litradock/demo/result.json evidence/demo-result.json
          cp .litradock/demo/demo-environment.json evidence/
      - name: Actual unattended recovery and PostgreSQL object-pair restore drill
        if: ${{ !cancelled() }}
        env:
          LITRADOCK_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          chmod +x tests/recovery/pg_dump.sh tests/recovery/pg_restore.sh
          export LITRADOCK_PG_DUMP="$PWD/tests/recovery/pg_dump.sh"
          export LITRADOCK_PG_RESTORE="$PWD/tests/recovery/pg_restore.sh"
          python3 tests/recovery/measure.py evidence/recovery-resources.json -- dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --recovery .litradock/recovery 2>&1 | tee evidence/recovery.log
          cp .litradock/recovery/result.json evidence/recovery-result.json
          cp .litradock/recovery/recovery-scale.json evidence/recovery-scale.json
          cp .litradock/recovery/recovery-library-scale.json evidence/recovery-library-scale.json
      - name: Actual Chromium hosted workflow with test-only sources
        if: ${{ !cancelled() }}
        env:
          LITRADOCK_PG_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=litradock_ci_browser;Username=fixture;Password=synthetic-ci-only-password;SSL Mode=Disable
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} createdb --username fixture litradock_ci_browser
          node --version > evidence/browser-environment.txt
          npm --version >> evidence/browser-environment.txt
          retain_browser_evidence() {
            taskExitCode=$?
            for artifact in .litradock/hosted-browser/browser-*.png .litradock/hosted-browser/failure.json .litradock/hosted-browser/restore-responses.json; do
              if [ -f "$artifact" ]; then cp "$artifact" evidence/; fi
            done
            if [ -f .litradock/hosted-browser/result.json ]; then cp .litradock/hosted-browser/result.json evidence/browser-result.json; fi
            exit "$taskExitCode"
          }
          trap retain_browser_evidence EXIT
          dotnet restore tests/LitraDock.HostedBrowserHost --locked-mode 2>&1 | tee evidence/browser-restore.log
          dotnet build tests/LitraDock.HostedBrowserHost -c Release --no-restore 2>&1 | tee evidence/browser-build.log
          npm ci --prefix tests/hosted-web 2>&1 | tee evidence/browser-npm.log
          tests/hosted-web/node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee evidence/browser-install.log
          python3 tests/recovery/measure.py evidence/browser-resources.json -- node tests/hosted-web/verify.mjs .litradock/hosted-browser 2>&1 | tee evidence/browser.log
      - name: Production demo real PubMed search and reviewed two-item batch
        if: ${{ !cancelled() }}
        env:
          LITRADOCK_PG_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=litradock_ci_demo_live;Username=fixture;Password=synthetic-ci-only-password;SSL Mode=Disable
          LITRADOCK_ALLOW_LIVE_SOURCE_PROBE: 'yes'
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} createdb --username fixture litradock_ci_demo_live
          retain_demo_evidence() {
            taskExitCode=$?
            if [ -f .litradock/demo-live/result.json ]; then cp .litradock/demo-live/result.json evidence/demo-live-result.json; fi
            for artifact in .litradock/demo-live/demo-*.png; do
              if [ -f "$artifact" ]; then cp "$artifact" evidence/; fi
            done
            exit "$taskExitCode"
          }
          trap retain_demo_evidence EXIT
          python3 tests/recovery/measure.py evidence/demo-live-resources.json -- node tests/hosted-web/demo.mjs .litradock/demo-live 2>&1 | tee evidence/demo-live.log
          docker exec ${{ job.services.postgres.id }} psql --username fixture --dbname litradock_ci_demo_live -Atc 'SELECT provider,day,requests FROM ld_source_usage ORDER BY provider,day' > evidence/demo-source-requests.txt
      - name: Publish production demo candidate without fixture or paper content
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet publish src/LitraDock.Hosted -c Release --no-restore --no-build -o .litradock/demo-package 2>&1 | tee evidence/demo-publish.log
          cp LICENSE THIRD-PARTY-NOTICES.md DEMO.md .litradock/demo-package/
          test -f .litradock/demo-package/LitraDock.Hosted.dll
          test -f .litradock/demo-package/wwwroot/hosted.js
          test -z "$(find .litradock/demo-package -iname '*Fixture*' -o -iname '*BrowserHost*' -o -iname '*Verification*')"
          find .litradock/demo-package -type f -print0 | sort -z | xargs -0 sha256sum > evidence/demo-package-hashes.txt
          tar -czf evidence/demo-candidate-linux-framework-dependent.tar.gz -C .litradock/demo-package .
      - name: Retain bounded verification evidence and code-only package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-verification-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error

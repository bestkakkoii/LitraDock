name: Credential rotation and targeted regression
on:
  push:
    branches: [credential-rotation-002]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: credential-rotation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: litradock_ci_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LITRADOCK_PG_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=litradock_ci_foundation;Username=fixture;Password=synthetic-ci-only-password;SSL Mode=Disable
      LITRADOCK_ALLOW_EPHEMERAL_TEST: 'yes'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.400'
      - name: Environment and locked restore
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet --info > evidence/environment.txt
          uname -a >> evidence/environment.txt
          lscpu >> evidence/environment.txt
          free -m >> evidence/environment.txt
          dotnet restore tests/LitraDock.HostedVerification --locked-mode 2>&1 | tee evidence/restore.log
      - name: Build and offline checks
        run: |
          set -euo pipefail
          dotnet build tests/LitraDock.HostedVerification -c Release --no-restore 2>&1 | tee evidence/build.log
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --static .litradock/static 2>&1 | tee evidence/static.log
          cp .litradock/static/result.json evidence/static-result.json
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --sources .litradock/sources 2>&1 | tee evidence/sources.log
          cp .litradock/sources/result.json evidence/sources-result.json
      - name: Pinned offline document assets and actual PDF rendering
        run: |
          set -euo pipefail
          export DOCUMENT_WORKER="$PWD/src/document-worker/worker.mjs"
          echo "DOCUMENT_WORKER=$DOCUMENT_WORKER" >> "$GITHUB_ENV"
          npm ci --prefix src/document-worker --ignore-scripts 2>&1 | tee evidence/document-npm.log
          python3 src/document-worker/setup-assets.py 2>&1 | tee evidence/document-assets.log
          node src/document-worker/node_modules/playwright/cli.js install --with-deps chromium 2>&1 | tee evidence/document-browser-install.log
          # Install only the helper shipped with this pinned Chromium download; preserve AppArmor policy.
          browser_path=$(node --input-type=module -e "import {chromium} from './src/document-worker/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")
          helper_path="$(dirname "$browser_path")/chrome_sandbox"
          test -f "$helper_path"
          sha256sum "$helper_path" | tee evidence/chromium-sandbox-helper.txt
          sudo install -d -o root -g root -m 0755 /opt/document-worker-sandbox
          sudo install -o root -g root -m 4755 "$helper_path" /opt/document-worker-sandbox/chrome-sandbox
          export CHROME_DEVEL_SANDBOX=/opt/document-worker-sandbox/chrome-sandbox
          stat -c '%U %a %n' "$CHROME_DEVEL_SANDBOX" >> evidence/chromium-sandbox-helper.txt
          echo "CHROME_DEVEL_SANDBOX=$CHROME_DEVEL_SANDBOX" >> "$GITHUB_ENV"
      - name: Actual PostgreSQL, migration, lease and HTTP isolation checks
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --postgres .litradock/postgres 2>&1 | tee evidence/postgres.log
          cp .litradock/postgres/result.json evidence/postgres-result.json
          cp .litradock/postgres/source-scale.json evidence/source-scale.json
      - name: Actual account lifecycle, rollback and lock concurrency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --identity .litradock/identity 2>&1 | tee evidence/identity.log
          cp .litradock/identity/result.json evidence/identity-result.json
          cp .litradock/identity/environment.json evidence/identity-environment.json
          cp .litradock/identity/operator-results.json evidence/identity-operator-results.json
      - name: Actual research decisions, conversions and selected relocation
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tests/recovery/measure.py evidence/research-resources.json -- dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --research .litradock/research 2>&1 | tee evidence/research.log
          cp .litradock/research/result.json evidence/research-result.json
          cp .litradock/research/research-scale.json evidence/
      - name: Actual unattended recovery and PostgreSQL object-pair restore drill
        if: ${{ !cancelled() }}
        env:
          LITRADOCK_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          chmod +x tests/recovery/pg_dump.sh tests/recovery/pg_restore.sh
          export LITRADOCK_PG_DUMP="$PWD/tests/recovery/pg_dump.sh"
          export LITRADOCK_PG_RESTORE="$PWD/tests/recovery/pg_restore.sh"
          python3 tests/recovery/measure.py evidence/recovery-resources.json -- dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --recovery .litradock/recovery 2>&1 | tee evidence/recovery.log
          cp .litradock/recovery/result.json evidence/recovery-result.json
          cp .litradock/recovery/recovery-scale.json evidence/recovery-scale.json
          cp .litradock/recovery/recovery-library-scale.json evidence/recovery-library-scale.json
      - name: Actual credential rotation, rollback, termination and row-lock schedules
        run: |
          set -euo pipefail
          dotnet run --project tests/LitraDock.HostedVerification -c Release --no-build -- --credential-rotation .litradock/rotation 2>&1 | tee evidence/rotation.log
          cp .litradock/rotation/result.json evidence/rotation-result.json
          cp .litradock/rotation/environment.json evidence/rotation-environment.json
          cp .litradock/rotation/operator-results.json evidence/rotation-operator-results.json
      - name: Separate operator-capable production package
        run: |
          set -euo pipefail
          dotnet publish src/LitraDock.Hosted -c Release --no-restore --no-build -o .litradock/credential-package 2>&1 | tee evidence/rotation-publish.log
          cp LICENSE THIRD-PARTY-NOTICES.md CREDENTIALS.md .litradock/credential-package/
          test -z "$(find .litradock/credential-package -iname '*Fixture*' -o -iname '*BrowserHost*' -o -iname '*Verification*')"
          find .litradock/credential-package -type f -print0 | sort -z | xargs -0 sha256sum > evidence/rotation-package-hashes.txt
          tar -czf evidence/credential-rotation-linux-framework-dependent.tar.gz -C .litradock/credential-package .
      - name: Retain bounded evidence without test libraries or papers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-rotation-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: litradock_ci_qualification_admin
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LITRADOCK_ALLOW_EPHEMERAL_TEST: 'yes'
      QUALIFICATION_TEST_ADMIN: Host=127.0.0.1;Port=5432;Database=litradock_ci_qualification_admin;Username=fixture;Password=synthetic-ci-only-password;SSL Mode=Disable
      QUALIFICATION_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=litradock_ci_qualification;Username=qualification;Password=synthetic-qualification-password;SSL Mode=Disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.400'
      - name: Verify the existing frozen production package without rebuilding it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence .litradock/frozen-package
          python3 --version > evidence/environment.txt
          dotnet --info >> evidence/environment.txt
          gh run download 34691326605 --repo bestkakkoii/LitraDock --name hosted-verification-34691326605 --dir .litradock/frozen-evidence
          python3 deployment/qualification/verify_deployment.py package --manifest .litradock/frozen-evidence/demo-package-hashes.txt --manifest-sha256 6cb0ea98300fe3369482636a331acb161f897090032bd8d463a46ccc90ec7d1e --archive .litradock/frozen-evidence/demo-candidate-linux-framework-dependent.tar.gz --archive-sha256 1e385385217310681a86efe65f901b1a69cd9fb8b7a138d62ea270047da16d33 --output evidence/frozen-package.json
          python3 -c "import tarfile; tarfile.open('.litradock/frozen-evidence/demo-candidate-linux-framework-dependent.tar.gz').extractall('.litradock/frozen-package', filter='data')"
          python3 deployment/qualification/verify_deployment.py package --manifest .litradock/frozen-evidence/demo-package-hashes.txt --manifest-sha256 6cb0ea98300fe3369482636a331acb161f897090032bd8d463a46ccc90ec7d1e --installed .litradock/frozen-package --output evidence/frozen-installed.json
      - name: Prepare only a disposable database using the frozen production migration command
        env:
          PGHOST: 127.0.0.1
          PGUSER: fixture
          PGDATABASE: litradock_ci_qualification_admin
          PGPASSWORD: synthetic-ci-only-password
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE qualification LOGIN PASSWORD 'synthetic-qualification-password'"
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE litradock_ci_qualification OWNER qualification'
          export LITRADOCK_POSTGRES="$QUALIFICATION_TEST_POSTGRES"
          export LITRADOCK_OBJECTS="$PWD/.litradock/qualification-objects"
          qualification_root="$PWD"
          cd .litradock/frozen-package
          dotnet LitraDock.Hosted.dll --migrate > "$qualification_root/evidence/migrate.txt"
      - name: Safe isolated archive, permission, redaction and actual PostgreSQL controls
        run: |
          set -euo pipefail
          python3 tests/deployment/test_qualification.py evidence/qualification-result.json 2>&1 | tee evidence/qualification.log
      - name: Keep only bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-qualification-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error

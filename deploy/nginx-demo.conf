# Substitute actual project hostname and certificate paths, then nginx -t on the target.
server {
    listen 443 ssl;
    server_name REQUIRED_PROJECT_HOSTNAME;
    ssl_certificate /etc/letsencrypt/live/REQUIRED_PROJECT_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REQUIRED_PROJECT_HOSTNAME/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_no_cache 1;
        proxy_read_timeout 120s;
    }
}
